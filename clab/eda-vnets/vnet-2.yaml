apiVersion: services.eda.nokia.com/v2
kind: VirtualNetwork
metadata:
  name: vnet-2
  namespace: clab-srl-leaf-spine-dcgw
spec:
  bridgeDomains:
  - name: bd-2
    spec:
      encapOptions:
        vxlan:
          tunnelIndexPool: tunnel-index-pool
          vniPool: vni-pool
      eviPool: evi-pool
      macLearning:
        agingTimeSeconds: 300
        enabled: true
      type: EVPNVXLAN
  bridgeInterfaces: []
  irbInterfaces:
  - name: irb-2
    spec:
      bridgeDomain: bd-2
      evpnRouteAdvertisementType:
        arpDynamic: true
        arpStatic: true
        ndDynamic: true
        ndStatic: true
      hostRoutePopulate:
        dynamic:
          populate: true
        evpn:
          datapathProgramming: true
          populate: true
        static:
          populate: true
      ipAddresses:
      - ipv4Address:
          ipPrefix: 172.16.201.254/24
          primary: true
        ipv6Address:
          ipPrefix: fc00:21::1/120
          primary: true
      ipMTU: 1500
      ipv4:
        arpTimeoutSeconds: 14400
        learnUnsolicitedARP: Disabled
      ipv6:
        learnUnsolicitedNA: Disabled
      router: router-2
      virtualIPDiscovery: []
  routedInterfaces: []
  routers:
  - name: router-2
    spec:
      bgp:
        autonomousSystem: 65402
        ebgpPreference: 170
        enabled: true
        ibgpPreference: 170
        ipv4Unicast:
          enabled: true
        minWaitToAdvertiseSeconds: 0
        rapidWithdrawl: true
        waitForFIBInstall: false
      encapOptions:
        vxlan:
          tunnelIndexPool: tunnel-index-pool
          vniPool: vni-pool
      eviPool: evi-pool
      routerID: 2.3.4.5
      type: EVPNVXLAN
  vlans:
  - name: vlan-null-vnet-2
    spec:
      bridgeDomain: bd-2
      interfaceSelectors:
      - eda.nokia.com/vnet-2=vlan-bd-2
      vlanID: "null"
---
