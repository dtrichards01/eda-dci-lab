# dcgw-1/2 WAN side: IS-IS L2 + SR-MPLS toward sros-pe-1 (other namespace) and between the pair,
# plus WAN VPN BGP to the standalone dcgw-3/4.
apiVersion: mpls.eda.nokia.com/v1alpha1
kind: LabelBlock
metadata:
  name: srgb-wan
  namespace: clab-srl-leaf-spine-dcgw
spec:
  startLabel: 18432
  endLabel: 20431
  type: Static
---
apiVersion: protocols.eda.nokia.com/v2
kind: DefaultISISInstance
metadata:
  name: isis-instance-1
  namespace: clab-srl-leaf-spine-dcgw
spec:
  enabled: true
  addressFamilies: [IPv4]
  areaIDs: ["49.0001"]
  levelCapability: L2
  passiveOnly: false
  segmentRouting:
    mpls:
      enabled: true
      nodeSIDIndexPool: sr-node-sid-pool
      srgbLabelBlock: srgb-wan
  tlvConfig:
    poi: true
---
apiVersion: protocols.eda.nokia.com/v2
kind: DefaultISISInterface
metadata:
  name: system-dcgw-1-system0-isis
  namespace: clab-srl-leaf-spine-dcgw
spec:
  defaultISISInstance: isis-instance-1
  interface: dcgw-1-system0
  interfaceKind: SystemInterface
  level: L2
  passive: true
  type: PointToPoint
---
apiVersion: protocols.eda.nokia.com/v2
kind: DefaultISISInterface
metadata:
  name: system-dcgw-2-system0-isis
  namespace: clab-srl-leaf-spine-dcgw
spec:
  defaultISISInstance: isis-instance-1
  interface: dcgw-2-system0
  interfaceKind: SystemInterface
  level: L2
  passive: true
  type: PointToPoint
---
apiVersion: fabrics.eda.nokia.com/v1
kind: ISL
metadata:
  name: dcgw-1-to-dcgw-2
  namespace: clab-srl-leaf-spine-dcgw
spec:
  localDefaultRouter: router-dcgw-1
  localInterface: dcgw-1-ethernet-1-3
  remoteDefaultRouter: router-dcgw-2
  remoteInterface: dcgw-2-ethernet-1-3
  poolIPv4: ipv4-pool
  ospf:
    enabled: false
  isis:
    enabled: true
    addressFamilies: [IPv4]
    localInstance: isis-instance-1
    remoteInstance: isis-instance-1
---
apiVersion: interfaces.eda.nokia.com/v1
kind: Interface
metadata:
  name: dcgw-1-ethernet-1-5
  namespace: clab-srl-leaf-spine-dcgw
spec:
  description: WAN link to sros-pe-1 1/1/c1/1 (ns clab-srl-dcgw-wan)
  enabled: true
  encapType: "Null"
  lldp: true
  mtu: 1500
  type: Interface
  members:
  - node: dcgw-1
    interface: ethernet-1-5
    enabled: true
---
apiVersion: interfaces.eda.nokia.com/v1
kind: Interface
metadata:
  name: dcgw-2-ethernet-1-5
  namespace: clab-srl-leaf-spine-dcgw
spec:
  description: WAN link to sros-pe-1 1/1/c2/1 (ns clab-srl-dcgw-wan)
  enabled: true
  encapType: "Null"
  lldp: true
  mtu: 1500
  type: Interface
  members:
  - node: dcgw-2
    interface: ethernet-1-5
    enabled: true
---
apiVersion: routing.eda.nokia.com/v1
kind: DefaultInterface
metadata:
  name: dcgw-1-e1-5-pe-1
  namespace: clab-srl-leaf-spine-dcgw
spec:
  defaultRouter: router-dcgw-1
  interface: dcgw-1-ethernet-1-5
  ipMTU: 1486
  ipv4Addresses:
  - ipPrefix: 192.168.210.0/31
    primary: true
---
apiVersion: routing.eda.nokia.com/v1
kind: DefaultInterface
metadata:
  name: dcgw-2-e1-5-pe-1
  namespace: clab-srl-leaf-spine-dcgw
spec:
  defaultRouter: router-dcgw-2
  interface: dcgw-2-ethernet-1-5
  ipMTU: 1486
  ipv4Addresses:
  - ipPrefix: 192.168.210.2/31
    primary: true
---
apiVersion: protocols.eda.nokia.com/v2
kind: DefaultISISInterface
metadata:
  name: dcgw-1-e1-5-pe-1-isis
  namespace: clab-srl-leaf-spine-dcgw
spec:
  defaultISISInstance: isis-instance-1
  interface: dcgw-1-e1-5-pe-1
  interfaceKind: DefaultInterface
  level: L2
  passive: false
  type: PointToPoint
---
apiVersion: protocols.eda.nokia.com/v2
kind: DefaultISISInterface
metadata:
  name: dcgw-2-e1-5-pe-1-isis
  namespace: clab-srl-leaf-spine-dcgw
spec:
  defaultISISInstance: isis-instance-1
  interface: dcgw-2-e1-5-pe-1
  interfaceKind: DefaultInterface
  level: L2
  passive: false
  type: PointToPoint
---
apiVersion: protocols.eda.nokia.com/v2
kind: DefaultBGPGroup
metadata:
  name: default-bgp-group-dc-1
  namespace: clab-srl-leaf-spine-dcgw
spec:
  localAS:
    autonomousSystem: 1000
  peerAS:
    autonomousSystem: 1001
  l2VPNEVPN:
    enabled: true
  vpnIPv4Unicast:
    enabled: true
---
apiVersion: protocols.eda.nokia.com/v2
kind: DefaultBGPPeer
metadata:
  name: dcgw-1-dcgw-3-bgp-peer
  namespace: clab-srl-leaf-spine-dcgw
spec:
  group: default-bgp-group-dc-1
  interface: dcgw-1-system0
  interfaceKind: SystemInterface
  peerIP: 11.0.2.3
  localAS:
    autonomousSystem: 65401
  peerAS:
    autonomousSystem: 65402
  multiHopMaxHop: 5
  nextHopSelf: true
  dynamicNeighbor: false
  importPolicies: [import-dci-services-dc-1]
  exportPolicies: [export-dc-1-routes-and-add-soo]
  vpnIPv4Unicast:
    enabled: true
    advertiseIPv6NextHops: true
---
apiVersion: protocols.eda.nokia.com/v2
kind: DefaultBGPPeer
metadata:
  name: dcgw-2-dcgw-4-bgp-peer
  namespace: clab-srl-leaf-spine-dcgw
spec:
  group: default-bgp-group-dc-1
  interface: dcgw-2-system0
  interfaceKind: SystemInterface
  peerIP: 11.0.2.4
  localAS:
    autonomousSystem: 65401
  peerAS:
    autonomousSystem: 65402
  multiHopMaxHop: 5
  nextHopSelf: true
  dynamicNeighbor: false
  importPolicies: [import-dci-services-dc-1]
  exportPolicies: [export-dc-1-routes-and-add-soo]
  vpnIPv4Unicast:
    enabled: true
    advertiseIPv6NextHops: true
