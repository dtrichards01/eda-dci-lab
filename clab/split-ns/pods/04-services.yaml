---
apiVersion: services.eda.nokia.com/v2
kind: RouterInterconnect
metadata:
  name: router-interconnect-vnet-1
  namespace: clab-srl-leaf-spine-dcgw
spec:
  routerRef: {name: router-1}
  nodeSelectors: ["eda.nokia.com/dci=dc-1"]
  primaryBGPInstance: {domainId: "65000:200"}
  interconnectBGPInstance:
    controlPlane: IPVPN
    encapsulation: MPLS
    domainId: "65000:100"
    evi: 1000
    exportTarget: target:1:100
    importTarget: target:1:101
    mpls: {allowedTunnelTypes: [SR-ISIS]}
    routeDistinguisher: {type: Type 0, assignedNumber: "2"}
---
apiVersion: services.eda.nokia.com/v2
