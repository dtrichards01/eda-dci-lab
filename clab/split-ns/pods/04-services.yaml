# Leaf-side services. EVI/VNI/RT pinned to the single-namespace values so the WAN namespace
# (dcgw-3/4) can define matching router-2 / bd-4.
apiVersion: services.eda.nokia.com/v2
kind: VirtualNetwork
metadata:
  name: vnet-1
  namespace: clab-srl-leaf-spine-dcgw
spec:
  bridgeDomains:
  - name: bd-1
    spec:
      type: EVPNVXLAN
      evi: 101
      exportTarget: target:1:101
      importTarget: target:1:101
      encapOptions: {vxlan: {vni: 201, tunnelIndexPool: tunnel-index-pool}}
      macLearning: {enabled: true, agingTimeSeconds: 300}
      macLimit: 2000
  routers:
  - name: router-1
    spec:
      type: EVPNVXLAN
      evi: 100
      exportTarget: target:1:100
      importTarget: target:1:100
      encapOptions: {vxlan: {vni: 200, tunnelIndexPool: tunnel-index-pool}}
      routerID: 1.2.3.4
      bgp: {enabled: true, autonomousSystem: 65401, ebgpPreference: 170, ibgpPreference: 170, ipv4Unicast: {enabled: true}, minWaitToAdvertiseSeconds: 0, rapidWithdrawl: true, waitForFIBInstall: false}
  irbInterfaces:
  - name: irb-1
    spec:
      bridgeDomain: bd-1
      router: router-1
      ipMTU: 1500
      ipAddresses:
      - ipv4Address: {ipPrefix: 172.16.101.254/24, anycast: true, primary: true}
      - ipv6Address: {ipPrefix: "fc00:11::1/120", primary: true}
      evpnRouteAdvertisementType: {arpDynamic: true, arpStatic: true, ndDynamic: true, ndStatic: true, rfc9135SymmetricMode: true}
      hostRoutePopulate: {evpn: {populate: true, datapathProgramming: true}}
      indexAllocation: {mode: GlobalPool, indexPool: irb-subif-pool}
      ipv4: {arpTimeoutSeconds: 14400, learnUnsolicitedARP: Disabled}
      ipv6: {learnUnsolicitedNA: Disabled}
  vlans:
  - name: vlan-null-vnet-1
    spec: {bridgeDomain: bd-1, vlanID: "null", interfaceSelectors: ["eda.nokia.com/vnet-1=vlan-bd-1"]}
---
