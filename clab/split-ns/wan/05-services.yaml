# DCI interconnects for the pod-2 services. The services live only in the pod namespace; the interconnects
# live here with the standalone DCGWs and reference router-2 / bd-4 across namespaces.
apiVersion: services.eda.nokia.com/v2
kind: RouterInterconnect
metadata:
  name: router-interconnect-vnet-2
  namespace: clab-srl-dcgw-wan
spec:
  routerRef: {name: router-2, namespace: clab-srl-leaf-spine-dcgw}
  nodeSelectors: ["eda.nokia.com/dci=dc-2"]
  primaryBGPInstance: {domainId: "65001:201"}
  interconnectBGPInstance:
    controlPlane: IPVPN
    encapsulation: MPLS
    domainId: "65000:101"
    evi: 1000
    exportTarget: target:1:101
    importPolicy: multi-rt-import
    mpls: {allowedTunnelTypes: [SR-ISIS]}
    routeDistinguisher: {type: Type 0, assignedNumber: "2"}
---
apiVersion: services.eda.nokia.com/v2
kind: BridgeDomainInterconnect
metadata:
  name: bd-interconnect-vnet-4
  namespace: clab-srl-dcgw-wan
spec:
  bridgeDomainRef: {name: bd-4, namespace: clab-srl-leaf-spine-dcgw}
  nodeSelectors: ["eda.nokia.com/dci=dc-2"]
  # Both RDs are required with redundant DCGWs. Auto makes both gateways advertise the same RD and originating IP
  # (the lower system IP of the pair), so they never flood to each other. Without it, BUM loops over the WAN.
  primaryBGPInstance:
    routeDistinguisher: {administrator: Auto, assignedNumber: Auto}
  interconnectBGPInstance:
    controlPlane: EVPN
    encapsulation: MPLS
    evi: 111
    exportTarget: target:1:301
    importTarget: target:1:300
    mpls: {allowedTunnelTypes: [SR-ISIS], controlWord: true}
    routeDistinguisher: {administrator: Auto, assignedNumber: Auto}
