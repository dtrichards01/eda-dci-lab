# WAN IGP: IS-IS L2 + SR-MPLS. dcgw-3/4 (isis-instance-2), PEs (isis-instance-backbone).
# PE-1 links to dcgw-1/2 cross into ns clab-srl-leaf-spine-dcgw, so they are DefaultInterfaces, not ISLs.
apiVersion: protocols.eda.nokia.com/v2
kind: DefaultISISInstance
metadata:
  name: isis-instance-2
  namespace: clab-srl-dcgw-wan
spec:
  enabled: true
  addressFamilies: [IPv4]
  areaIDs: ["49.0001"]
  levelCapability: L2
  passiveOnly: false
  segmentRouting:
    mpls: {enabled: true, nodeSIDIndexPool: sr-node-sid-pool, srgbLabelBlock: srgb-wan}
  tlvConfig: {poi: true}
---
apiVersion: protocols.eda.nokia.com/v2
kind: DefaultISISInstance
metadata:
  name: isis-instance-backbone
  namespace: clab-srl-dcgw-wan
spec:
  enabled: true
  addressFamilies: [IPv4]
  areaIDs: ["49.0001"]
  levelCapability: L2
  passiveOnly: false
  segmentRouting:
    mpls: {enabled: true, nodeSIDIndexPool: sr-node-sid-pool, srgbLabelBlock: srgb-wan}
  tlvConfig: {poi: true}
---
apiVersion: protocols.eda.nokia.com/v2
kind: DefaultISISInterface
metadata:
  name: system-dcgw-3-system0-isis
  namespace: clab-srl-dcgw-wan
spec: {defaultISISInstance: isis-instance-2, interface: dcgw-3-system0, interfaceKind: SystemInterface, level: L2, passive: true, type: PointToPoint}
---
apiVersion: protocols.eda.nokia.com/v2
kind: DefaultISISInterface
metadata:
  name: system-dcgw-4-system0-isis
  namespace: clab-srl-dcgw-wan
spec: {defaultISISInstance: isis-instance-2, interface: dcgw-4-system0, interfaceKind: SystemInterface, level: L2, passive: true, type: PointToPoint}
---
apiVersion: protocols.eda.nokia.com/v2
kind: DefaultISISInterface
metadata:
  name: system-sros-pe-1-system0-isis
  namespace: clab-srl-dcgw-wan
spec: {defaultISISInstance: isis-instance-backbone, interface: sros-pe-1-system0, interfaceKind: SystemInterface, level: L2, passive: true, type: PointToPoint}
---
apiVersion: protocols.eda.nokia.com/v2
kind: DefaultISISInterface
metadata:
  name: system-sros-pe-2-system0-isis
  namespace: clab-srl-dcgw-wan
spec: {defaultISISInstance: isis-instance-backbone, interface: sros-pe-2-system0, interfaceKind: SystemInterface, level: L2, passive: true, type: PointToPoint}
---
apiVersion: fabrics.eda.nokia.com/v1
kind: ISL
metadata:
  name: dcgw-3-to-dcgw-4
  namespace: clab-srl-dcgw-wan
spec:
  localDefaultRouter: router-dcgw-3
  localInterface: dcgw-3-ethernet-1-3
  remoteDefaultRouter: router-dcgw-4
  remoteInterface: dcgw-4-ethernet-1-3
  poolIPv4: ipv4-pool
  ospf: {enabled: false}
  isis: {enabled: true, addressFamilies: [IPv4], localInstance: isis-instance-2, remoteInstance: isis-instance-2}
---
apiVersion: fabrics.eda.nokia.com/v1
kind: ISL
metadata:
  name: dcgw-3-to-pe-2
  namespace: clab-srl-dcgw-wan
spec:
  localDefaultRouter: router-sros-pe-2
  localInterface: ${PE2_C3}
  remoteDefaultRouter: router-dcgw-3
  remoteInterface: dcgw-3-ethernet-1-6
  poolIPv4: ipv4-pool
  ospf: {enabled: false}
  isis: {enabled: true, addressFamilies: [IPv4], localInstance: isis-instance-backbone, remoteInstance: isis-instance-2}
---
apiVersion: fabrics.eda.nokia.com/v1
kind: ISL
metadata:
  name: dcgw-4-to-pe-2
  namespace: clab-srl-dcgw-wan
spec:
  localDefaultRouter: router-sros-pe-2
  localInterface: ${PE2_C4}
  remoteDefaultRouter: router-dcgw-4
  remoteInterface: dcgw-4-ethernet-1-6
  poolIPv4: ipv4-pool
  ospf: {enabled: false}
  isis: {enabled: true, addressFamilies: [IPv4], localInstance: isis-instance-backbone, remoteInstance: isis-instance-2}
---
apiVersion: interfaces.eda.nokia.com/v1
kind: Interface
metadata:
  name: ${PE1_C1}
  namespace: clab-srl-dcgw-wan
spec:
  description: WAN link to dcgw-1 e1-5 (ns clab-srl-leaf-spine-dcgw)
  enabled: true
  encapType: "Null"
  lldp: true
  mtu: 1500
  type: Interface
  members:
  - {node: sros-pe-1, interface: ${PE1_C1_PORT}, enabled: true}
---
apiVersion: interfaces.eda.nokia.com/v1
kind: Interface
metadata:
  name: ${PE1_C2}
  namespace: clab-srl-dcgw-wan
spec:
  description: WAN link to dcgw-2 e1-5 (ns clab-srl-leaf-spine-dcgw)
  enabled: true
  encapType: "Null"
  lldp: true
  mtu: 1500
  type: Interface
  members:
  - {node: sros-pe-1, interface: ${PE1_C2_PORT}, enabled: true}
---
apiVersion: routing.eda.nokia.com/v1
kind: DefaultInterface
metadata:
  name: pe-1-c1-dcgw-1
  namespace: clab-srl-dcgw-wan
spec:
  defaultRouter: router-sros-pe-1
  interface: ${PE1_C1}
  ipMTU: 1486
  ipv4Addresses: [{ipPrefix: 192.168.210.1/31, primary: true}]
---
apiVersion: routing.eda.nokia.com/v1
kind: DefaultInterface
metadata:
  name: pe-1-c2-dcgw-2
  namespace: clab-srl-dcgw-wan
spec:
  defaultRouter: router-sros-pe-1
  interface: ${PE1_C2}
  ipMTU: 1486
  ipv4Addresses: [{ipPrefix: 192.168.210.3/31, primary: true}]
---
apiVersion: protocols.eda.nokia.com/v2
kind: DefaultISISInterface
metadata:
  name: pe-1-c1-dcgw-1-isis
  namespace: clab-srl-dcgw-wan
spec: {defaultISISInstance: isis-instance-backbone, interface: pe-1-c1-dcgw-1, interfaceKind: DefaultInterface, level: L2, passive: false, type: PointToPoint}
---
apiVersion: protocols.eda.nokia.com/v2
kind: DefaultISISInterface
metadata:
  name: pe-1-c2-dcgw-2-isis
  namespace: clab-srl-dcgw-wan
spec: {defaultISISInstance: isis-instance-backbone, interface: pe-1-c2-dcgw-2, interfaceKind: DefaultInterface, level: L2, passive: false, type: PointToPoint}
