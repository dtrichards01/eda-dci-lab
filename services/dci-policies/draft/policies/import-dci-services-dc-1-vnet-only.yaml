# DRAFT — DC1 WAN import: only vnet-2 hub stitch (RT 101), type-5 + VPNv4.
# Replaces permissive import-dci-services-dc-1 (default Accept leaks remote fabric).
apiVersion: routingpolicies.eda.nokia.com/v1
kind: Policy
metadata:
  name: import-dci-services-dc-1
  namespace: clab-srl-leaf-spine-dcgw
  labels:
    eda.nokia.com/dci: l3-stitch
    eda.nokia.com/dci-draft: wan-dcgw-nh
spec:
  defaultAction:
    policyResult: Reject
  statements:
    - name: reject-dc1-soo-evpn
      action:
        policyResult: Reject
      match:
        families:
          - EVPN
        bgp:
          communitySet: soo-1122
    - name: accept-remote-hub-evpn-type-5
      action:
        policyResult: Accept
        tags:
          applyTagSet: tag-10
      match:
        families:
          - EVPN
        bgp:
          communitySet: dci-rt-dc2-l3
          evpnRouteTypes:
            - 5
    - name: accept-remote-hub-ipvpn
      action:
        policyResult: Accept
        tags:
          applyTagSet: tag-10
      match:
        protocol: BGP_IPVPN
        bgp:
          communitySet: dci-rt-dc2-l3
