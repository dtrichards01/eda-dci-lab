# Spoke interconnect import: hub stitch RT 101.
apiVersion: routingpolicies.eda.nokia.com/v1
kind: Policy
metadata:
  name: import-dci-hub-stitch
  namespace: clab-srl-leaf-spine-dcgw
  labels:
    eda.nokia.com/dci: l3-stitch
spec:
  defaultAction:
    policyResult: Reject
  statements:
    - name: accept-hub-evpn-type-1
      action:
        policyResult: Accept
      match:
        families:
          - EVPN
        bgp:
          communitySet: dci-rt-dc2-l3
          evpnRouteTypes:
            - 1
    - name: accept-hub-evpn-type-2
      action:
        policyResult: Accept
      match:
        families:
          - EVPN
        bgp:
          communitySet: dci-rt-dc2-l3
          evpnRouteTypes:
            - 2
    - name: accept-hub-evpn-type-3
      action:
        policyResult: Accept
      match:
        families:
          - EVPN
        bgp:
          communitySet: dci-rt-dc2-l3
          evpnRouteTypes:
            - 3
    - name: accept-hub-evpn-type-4
      action:
        policyResult: Accept
      match:
        families:
          - EVPN
        bgp:
          communitySet: dci-rt-dc2-l3
          evpnRouteTypes:
            - 4
    - name: accept-hub-evpn-type-5
      action:
        policyResult: Accept
      match:
        families:
          - EVPN
        bgp:
          communitySet: dci-rt-dc2-l3
          evpnRouteTypes:
            - 5
    - name: accept-hub-ipvpn-stitch
      action:
        policyResult: Accept
      match:
        protocol: BGP_IPVPN
        bgp:
          communitySet: dci-rt-dc2-l3
