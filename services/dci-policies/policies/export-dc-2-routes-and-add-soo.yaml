# DC2 WAN export: local vnet-2 hub stitch VPNv4 (RT 101) + SOO. VPNv4-only on WAN AFI.
apiVersion: routingpolicies.eda.nokia.com/v1
kind: Policy
metadata:
  name: export-dc-2-routes-and-add-soo
  namespace: clab-srl-leaf-spine-dcgw
  annotations:
    l2: loop-avoidance
  labels:
    eda.nokia.com/dci: l3-stitch
spec:
  defaultAction:
    policyResult: Reject
  statements:
    - name: reject-imported-evpn
      action:
        policyResult: Reject
      match:
        families:
          - EVPN
        tags:
          tagSet: tag-10
    - name: reject-imported-ipvpn
      action:
        policyResult: Reject
      match:
        protocol: BGP_IPVPN
        tags:
          tagSet: tag-10
    - name: reject-all-local-evpn
      action:
        policyResult: Reject
      match:
        families:
          - EVPN
    - name: export-local-ipvpn-vnet-2
      action:
        policyResult: Accept
        bgp:
          communities:
            addSets:
              - soo-2211
      match:
        bgp:
          communitySet: dci-rt-dc2-l3
