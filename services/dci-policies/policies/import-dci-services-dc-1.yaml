# WAN import on DC1 DCI BGP peers — hybrid L3 VPNv4 + L2 EVPN type-2/3 (RT 301).
apiVersion: routingpolicies.eda.nokia.com/v1

kind: Policy

metadata:

  name: import-dci-services-dc-1

  namespace: clab-srl-leaf-spine-dcgw

  labels:

    eda.nokia.com/dci: l3-stitch

spec:

  defaultAction:

    policyResult: Reject

  statements:

    - name: reject-dc1-soo-evpn

      action:

        policyResult: Reject

      match:

        families:

          - EVPN

        bgp:

          communitySet: soo-1122

    - name: accept-remote-l2-type-2-evpn

      action:

        policyResult: Accept

        tags:

          applyTagSet: tag-20

      match:

        families:

          - EVPN

        bgp:

          communitySet: dci-rt-l2-import-dc1

          evpnRouteTypes:

            - 2

    - name: accept-remote-l2-type-3-evpn

      action:

        policyResult: Accept

        tags:

          applyTagSet: tag-20

      match:

        families:

          - EVPN

        bgp:

          communitySet: dci-rt-l2-import-dc1

          evpnRouteTypes:

            - 3

    - name: reject-all-remote-evpn

      action:

        policyResult: Reject

      match:

        families:

          - EVPN

    - name: accept-remote-hub-ipvpn

      action:

        policyResult: Accept

        tags:

          applyTagSet: tag-20

      match:

        bgp:

          communitySet: dci-rt-dc2-l3


