# Primary DC1->DC2 link (dcgw-1-dcgw-3): export imported remote routes only.
apiVersion: routingpolicies.eda.nokia.com/v1
kind: Policy
metadata:
  name: export-wan-routes-only-dc-1
  namespace: clab-srl-leaf-spine-dcgw
  annotations:
    l2: loop-avoidance
  labels:
    eda.nokia.com/dci: l2-l3-stitch
spec:
  defaultAction:
    policyResult: Accept
  statements:
    - name: reject-local-evpn
      action:
        policyResult: Reject
      match:
        families:
          - EVPN
        tags:
          tagSet: tag-10
    - name: reject-local-ipvpn
      action:
        policyResult: Reject
      match:
        protocol: BGP_IPVPN
        tags:
          tagSet: tag-10
