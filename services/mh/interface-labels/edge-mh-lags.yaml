# MH L3-only ESI LAG edges (e1-10, Dot1q VLAN 200).
# Labels: role=edge + one vnet selector per LAG (no mh-es / L2 selectors).
---
apiVersion: interfaces.eda.nokia.com/v1
kind: Interface
metadata:
  name: mh-dc1a-lag-leaf-3-4
  namespace: clab-srl-leaf-spine-dcgw
  labels:
    eda.nokia.com/role: edge
    eda.nokia.com/vnet-mh-l3-dc1a: vlan-bd-mh-200-dc1a
spec:
  description: MH all-active DC1 L3 — client-10-dc1-mh (leaf-3 + leaf-4 e1-10)
  enabled: true
  encapType: Dot1q
  ethernet:
    stormControl:
      enabled: false
  lldp: true
  type: LAG
  lag:
    type: LACP
    minLinks: 1
    multihoming:
      mode: AllActive
      preferredActiveNode: srl-leaf-3
      revertive: true
    lacp:
      mode: Active
      interval: Fast
      systemPriority: 32768
  members:
    - enabled: true
      interface: ethernet-1-10
      lacpPortPriority: 32768
      node: srl-leaf-3
    - enabled: true
      interface: ethernet-1-10
      lacpPortPriority: 32768
      node: srl-leaf-4
---
