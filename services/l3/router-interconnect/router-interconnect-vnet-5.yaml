# L3 spoke DC1: vnet-5 / router-3 stitch (export RT 105, import hub RT 101).
apiVersion: services.eda.nokia.com/v2
kind: RouterInterconnect
metadata:
  name: router-interconnect-vnet-5
  namespace: clab-srl-leaf-spine-dcgw
  labels:
    eda.nokia.com/dci: spoke
spec:
  routerRef:
    name: router-3
  nodeSelectors:
    - eda.nokia.com/dci=dc-1
  primaryBGPInstance:
    domainId: 65000:202
  interconnectBGPInstance:
    controlPlane: IPVPN
    domainId: 65000:102
    encapsulation: MPLS
    evi: 1002
    exportTarget: target:1:105
    importTarget: target:1:101
    mpls:
      allowedTunnelTypes:
        - LDP
    routeDistinguisher:
      type: Type 0
      assignedNumber: "3"
