# L3 native DC2 hub edges for vnet-2 — operational Talos 2026-08-24:
# client-5 on leaf-5 e1-5, client-6 on leaf-6 e1-6 (not leaf-8).
---
apiVersion: interfaces.eda.nokia.com/v1
kind: Interface
metadata:
  name: srl-leaf-5-ethernet-1-5
  namespace: clab-srl-leaf-spine-dcgw
  labels:
    eda.nokia.com/role: edge
    eda.nokia.com/vnet-2: vlan-bd-2
spec:
  description: edge L3 vnet-2 hub DC2 — client-5
  enabled: true
  encapType: "Null"
  ethernet:
    stormControl:
      enabled: false
  lldp: true
  members:
    - enabled: true
      interface: ethernet-1-5
      lacpPortPriority: 32768
      node: srl-leaf-5
  type: Interface
---
apiVersion: interfaces.eda.nokia.com/v1
kind: Interface
metadata:
  name: srl-leaf-6-ethernet-1-6
  namespace: clab-srl-leaf-spine-dcgw
  labels:
    eda.nokia.com/role: edge
    eda.nokia.com/vnet-2: vlan-bd-2
spec:
  description: edge L3 vnet-2 hub DC2 — client-6
  enabled: true
  encapType: "Null"
  ethernet:
    stormControl:
      enabled: false
  lldp: true
  members:
    - enabled: true
      interface: ethernet-1-6
      lacpPortPriority: 32768
      node: srl-leaf-6
  type: Interface
